<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App de Mensagens</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #0084ff;
      --text: #ffffff;
      --text-sub: #aaa;
      --msg-in: #2a2a2a;
      --msg-out: #0084ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; height: 100vh; }
    
    .screen { display: none; width: 100%; max-width: 480px; height: 100vh; flex-direction: column; background: var(--card); }
    .active { display: flex; }

    /* Auth Screen */
    .auth-container { padding: 20px; display: flex; flex-direction: column; gap: 12px; justify-content: center; height: 100%; }
    input, select, textarea, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2b2b2b; color: #fff; }
    button { background: var(--accent); border: none; font-weight: bold; cursor: pointer; }
    .toggle-auth { text-align: center; color: var(--accent); cursor: pointer; margin-top: 10px; font-size: 14px; }

    /* Header & Navigation */
    header { padding: 12px; background: #151515; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #444; }
    nav { display: flex; background: #151515; border-top: 1px solid #333; }
    nav button { flex: 1; border-radius: 0; background: transparent; }

    /* Chat Area */
    .chat-box { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 12px; word-break: break-word; font-size: 14px; }
    .msg.in { background: var(--msg-in); align-self: flex-start; }
    .msg.out { background: var(--msg-out); align-self: flex-end; }
    .msg img.sticker { width: 120px; height: 120px; object-fit: contain; }
    .msg img.photo { max-width: 100%; border-radius: 8px; }

    /* Input Area */
    .input-bar { padding: 8px; background: #151515; display: flex; gap: 6px; align-items: center; }
    .input-bar input[type="text"] { flex: 1; }
    .icon-btn { width: 40px; height: 40px; padding: 0; display: flex; justify-content: center; align-items: center; background: #333; }

    /* Stickers Drawer */
    .stickers-panel { height: 120px; background: #181818; display: none; padding: 8px; gap: 8px; overflow-x: auto; border-top: 1px solid #333; }
    .stickers-panel.open { display: flex; }
    .sticker-item { width: 80px; height: 80px; object-fit: contain; cursor: pointer; flex-shrink: 0; }
    
    /* User Search List */
    .user-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-bottom: 1px solid #2a2a2a; cursor: pointer; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: gray; }
    .status-dot.online { background: #00ff66; }
  </style>
</head>
<body>

  <!-- TELA DE AUTENTICAÇÃO -->
  <div id="auth-screen" class="screen active">
    <div class="auth-container">
      <h2 id="auth-title" style="text-align: center;">Criar Conta</h2>
      <input type="text" id="auth-name" placeholder="Seu Nome">
      <input type="email" id="auth-email" placeholder="Seu E-mail">
      <input type="password" id="auth-pass" placeholder="Senha">
      <input type="password" id="auth-pass-confirm" placeholder="Confirme a Senha">
      <button id="auth-btn" onclick="handleAuth()">Cadastrar</button>
      <div class="toggle-auth" onclick="toggleAuthMode()">Já tem uma conta? Entrar</div>
    </div>
  </div>

  <!-- TELA PRINCIPAL / CHAT -->
  <div id="app-screen" class="screen">
    <header>
      <div style="display: flex; align-items: center; gap: 10px;">
        <img id="header-avatar" class="avatar" src="https://via.placeholder.com/40" onclick="switchTab('profile')">
        <div>
          <strong id="header-title">Chat Global</strong>
          <div style="font-size: 11px; color: var(--text-sub)" id="header-sub">Online</div>
        </div>
      </div>
      <button class="icon-btn" onclick="logout()" style="width: auto; padding: 0 8px;">Sair</button>
    </header>

    <!-- ABA CHAT GLOBAL / DM -->
    <div id="tab-chat" class="screen active" style="height: auto; flex: 1;">
      <div class="chat-box" id="chat-messages"></div>
      
      <!-- Painel de Figurinhas -->
      <div class="stickers-panel" id="stickers-panel">
        <label class="icon-btn" style="flex-shrink: 0; width: 80px; height: 80px; border: 2px dashed #555; border-radius: 8px;">
          + Fig
          <input type="file" id="sticker-upload" accept="image/*" hidden onchange="uploadSticker(event)">
        </label>
        <div id="stickers-list" style="display: flex; gap: 8px;"></div>
      </div>

      <div class="input-bar">
        <button class="icon-btn" onclick="toggleStickers()">🎨</button>
        <label class="icon-btn">
          📷 <input type="file" id="photo-upload" accept="image/*" hidden onchange="sendPhoto(event)">
        </label>
        <button class="icon-btn" id="audio-btn" onclick="toggleAudioRecord()">🎙️</button>
        <input type="text" id="message-input" placeholder="Digite uma mensagem...">
        <button class="icon-btn" onclick="sendMessage()">➔</button>
      </div>
    </div>

    <!-- ABA BUSCAR AMIGOS (DM) -->
    <div id="tab-search" class="screen" style="height: auto; flex: 1; padding: 12px;">
      <input type="text" id="search-input" placeholder="Pesquisar amigo por nome..." oninput="searchUsers()">
      <div id="users-results" style="margin-top: 12px; overflow-y: auto;"></div>
    </div>

    <!-- ABA PERFIL -->
    <div id="tab-profile" class="screen" style="height: auto; flex: 1; padding: 16px; overflow-y: auto;">
      <div style="display: flex; flex-direction: column; gap: 12px; align-items: center;">
        <img id="profile-img-preview" class="avatar" style="width: 100px; height: 100px;">
        <label style="font-size: 12px; color: var(--accent); cursor: pointer;">
          Alterar foto de perfil
          <input type="file" id="profile-pic-input" accept="image/*" hidden onchange="uploadProfilePic(event)">
        </label>
        
        <input type="text" id="profile-name" placeholder="Nome">
        <textarea id="profile-bio" placeholder="Sua Bio/Descrição"></textarea>
        <select id="profile-gender">
          <option value="Não especificado">Gênero: Não especificado</option>
          <option value="Masculino">Masculino</option>
          <option value="Feminino">Feminino</option>
          <option value="Outro">Outro</option>
        </select>
        <select id="profile-status">
          <option value="online">Status: Online</option>
          <option value="offline">Status: Offline</option>
        </select>
        <button onclick="saveProfile()">Salvar Perfil</button>
      </div>
    </div>

    <nav>
      <button onclick="openGlobalChat()">Global</button>
      <button onclick="switchTab('search')">Amigos</button>
      <button onclick="switchTab('profile')">Perfil</button>
    </nav>
  </div>

  <!-- FIREBASE SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, addDoc, query, orderBy, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // CONFIGURAÇÃO DO SEU PROJETO FIREBASE (DISCORD-3F2B7)
    const firebaseConfig = {
      apiKey: "AIzaSyC2D3vMG_s4GybahVnATdpU9y8K5jpWd88",
      authDomain: "discord-3f2b7.firebaseapp.com",
      projectId: "discord-3f2b7",
      storageBucket: "discord-3f2b7.firebasestorage.app",
      messagingSenderId: "91052736438",
      appId: "1:91052736438:web:be34de11c722949ad68b17",
      measurementId: "G-8QW8XJX0TE"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let currentUser = null;
    let userProfile = {};
    let activeChatId = "global"; 
    let isLoginMode = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let unsubscribeMessages = null;

    // --- AUTENTICAÇÃO ---
    window.toggleAuthMode = () => {
      isLoginMode = !isLoginMode;
      document.getElementById('auth-title').innerText = isLoginMode ? 'Entrar' : 'Criar Conta';
      document.getElementById('auth-name').style.display = isLoginMode ? 'none' : 'block';
      document.getElementById('auth-pass-confirm').style.display = isLoginMode ? 'none' : 'block';
      document.getElementById('auth-btn').innerText = isLoginMode ? 'Entrar' : 'Cadastrar';
      document.querySelector('.toggle-auth').innerText = isLoginMode ? 'Não tem conta? Cadastrar-se' : 'Já tem uma conta? Entrar';
    };

    window.handleAuth = async () => {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-pass').value;
      const name = document.getElementById('auth-name').value;
      const passConfirm = document.getElementById('auth-pass-confirm').value;

      try {
        if (isLoginMode) {
          await signInWithEmailAndPassword(auth, email, pass);
        } else {
          if (pass !== passConfirm) return alert("As senhas não coincidem!");
          if (!name) return alert("Informe seu nome.");
          
          const res = await createUserWithEmailAndPassword(auth, email, pass);
          await setDoc(doc(db, "users", res.user.uid), {
            uid: res.user.uid,
            name: name,
            email: email,
            bio: "Olá! Estou usando o app.",
            gender: "Não especificado",
            status: "online",
            photoURL: "https://via.placeholder.com/150",
            stickers: []
          });
        }
      } catch (err) { alert(err.message); }
    };

    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('auth-screen').classList.remove('active');
        document.getElementById('app-screen').classList.add('active');
        await loadUserProfile();
        openGlobalChat();
      } else {
        currentUser = null;
        document.getElementById('app-screen').classList.remove('active');
        document.getElementById('auth-screen').classList.add('active');
      }
    });

    // --- GERENCIAMENTO DE PERFIL ---
    async function loadUserProfile() {
      const docSnap = await getDoc(doc(db, "users", currentUser.uid));
      if (docSnap.exists()) {
        userProfile = docSnap.data();
        document.getElementById('header-avatar').src = userProfile.photoURL;
        document.getElementById('profile-img-preview').src = userProfile.photoURL;
        document.getElementById('profile-name').value = userProfile.name;
        document.getElementById('profile-bio').value = userProfile.bio;
        document.getElementById('profile-gender').value = userProfile.gender;
        document.getElementById('profile-status').value = userProfile.status;
        renderStickers();
      }
    }

    window.saveProfile = async () => {
      const updated = {
        name: document.getElementById('profile-name').value,
        bio: document.getElementById('profile-bio').value,
        gender: document.getElementById('profile-gender').value,
        status: document.getElementById('profile-status').value,
      };
      await updateDoc(doc(db, "users", currentUser.uid), updated);
      await loadUserProfile();
      alert("Perfil atualizado!");
    };

    window.uploadProfilePic = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fileRef = ref(storage, `profiles/${currentUser.uid}`);
      await uploadBytes(fileRef, file);
      const url = await getDownloadURL(fileRef);
      await updateDoc(doc(db, "users", currentUser.uid), { photoURL: url });
      loadUserProfile();
    };

    // --- NAVEGAÇÃO ENTRE ABAS ---
    window.switchTab = (tab) => {
      document.getElementById('tab-chat').classList.remove('active');
      document.getElementById('tab-search').classList.remove('active');
      document.getElementById('tab-profile').classList.remove('active');
      document.getElementById(`tab-${tab}`).classList.add('active');
    };

    window.openGlobalChat = () => {
      activeChatId = "global";
      document.getElementById('header-title').innerText = "Chat Global";
      document.getElementById('header-sub').innerText = "Todos os usuários";
      switchTab('chat');
      listenMessages();
    };

    window.openDM = (user) => {
      activeChatId = [currentUser.uid, user.uid].sort().join("_");
      document.getElementById('header-title').innerText = user.name;
      document.getElementById('header-sub').innerText = user.status;
      switchTab('chat');
      listenMessages();
    };

    // --- SISTEMA DE PESQUISA DE AMIGOS ---
    window.searchUsers = async () => {
      const text = document.getElementById('search-input').value.toLowerCase();
      const container = document.getElementById('users-results');
      container.innerHTML = "";
      if (!text) return;

      const q = query(collection(db, "users"));
      const snap = await getDocs(q);
      snap.forEach(docSnap => {
        const u = docSnap.data();
        if (u.uid !== currentUser.uid && u.name.toLowerCase().includes(text)) {
          const div = document.createElement('div');
          div.className = 'user-item';
          div.innerHTML = `
            <img src="${u.photoURL}" class="avatar">
            <div style="flex:1">
              <strong>${u.name}</strong>
              <div style="font-size:12px; color:gray">${u.bio}</div>
            </div>
            <div class="status-dot ${u.status === 'online' ? 'online' : ''}"></div>
          `;
          div.onclick = () => openDM(u);
          container.appendChild(div);
        }
      });
    };

    // --- MENSAGENS E MÍDIAS ---
    function listenMessages() {
      if (unsubscribeMessages) unsubscribeMessages();
      const q = query(
        collection(db, "chats", activeChatId, "messages"),
        orderBy("timestamp", "asc")
      );

      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        const box = document.getElementById('chat-messages');
        box.innerHTML = "";
        snapshot.forEach(docSnap => {
          const msg = docSnap.data();
          const isMe = msg.senderId === currentUser.uid;
          const el = document.createElement('div');
          el.className = `msg ${isMe ? 'out' : 'in'}`;

          if (msg.type === "text") el.innerText = msg.content;
          else if (msg.type === "image") el.innerHTML = `<img src="${msg.content}" class="photo">`;
          else if (msg.type === "sticker") el.innerHTML = `<img src="${msg.content}" class="sticker">`;
          else if (msg.type === "audio") el.innerHTML = `<audio controls src="${msg.content}"></audio>`;

          box.appendChild(el);
        });
        box.scrollTop = box.scrollHeight;
      });
    }

    window.sendMessage = async (type = "text", content = null) => {
      const input = document.getElementById('message-input');
      const text = content || input.value.trim();
      if (!text && type === "text") return;

      await addDoc(collection(db, "chats", activeChatId, "messages"), {
        senderId: currentUser.uid,
        type: type,
        content: text,
        timestamp: new Date()
      });

      if (type === "text") input.value = "";
    };

    window.sendPhoto = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fileRef = ref(storage, `chat_files/${Date.now()}_${file.name}`);
      await uploadBytes(fileRef, file);
      const url = await getDownloadURL(fileRef);
      sendMessage("image", url);
    };

    // --- GRAVAÇÃO DE ÁUDIO ---
    window.toggleAudioRecord = async () => {
      const btn = document.getElementById('audio-btn');
      if (!isRecording) {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: 'audio/mp3' });
          const fileRef = ref(storage, `audio/${Date.now()}.mp3`);
          await uploadBytes(fileRef, blob);
          const url = await getDownloadURL(fileRef);
          sendMessage("audio", url);
        };
        mediaRecorder.start();
        isRecording = true;
        btn.style.background = "red";
      } else {
        mediaRecorder.stop();
        isRecording = false;
        btn.style.background = "#333";
      }
    };

    // --- FIGURINHAS DA GALERIA ---
    window.toggleStickers = () => {
      document.getElementById('stickers-panel').classList.toggle('open');
    };

    window.uploadSticker = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fileRef = ref(storage, `stickers/${currentUser.uid}/${Date.now()}`);
      await uploadBytes(fileRef, file);
      const url = await getDownloadURL(fileRef);
      
      const updatedStickers = [...(userProfile.stickers || []), url];
      await updateDoc(doc(db, "users", currentUser.uid), { stickers: updatedStickers });
      userProfile.stickers = updatedStickers;
      renderStickers();
    };

    function renderStickers() {
      const list = document.getElementById('stickers-list');
      list.innerHTML = "";
      (userProfile.stickers || []).forEach(url => {
        const img = document.createElement('img');
        img.src = url;
        img.className = 'sticker-item';
        img.onclick = () => {
          sendMessage("sticker", url);
          toggleStickers();
        };
        list.appendChild(img);
      });
    }
  </script>
</body>
</html>
