<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c10" />
  <title>CineStream Pro Mobile</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0a0c10;
      --card-bg: rgba(22, 27, 34, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #ff2a5f;
      --primary-hover: #e01e4f;
      --primary-glow: rgba(255, 42, 95, 0.35);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --nav-height: 60px;
      --header-height: 50px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      position: fixed; /* Evita rolagens indesejadas na WebView */
    }

    /* Header Mobile com suporte a Safe Area (Notch) */
    header {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(10, 12, 16, 0.85);
      border-bottom: 1px solid var(--card-border);
      position: fixed;
      top: 0; left: 0; right: 0;
      height: calc(var(--header-height) + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      z-index: 100;
      padding-left: 16px;
      padding-right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #ff2a5f 0%, #7928ca 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Bottom Navigation Bar Sofisticada */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(var(--nav-height) + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(10, 12, 16, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 500;
      flex: 1;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      transition: transform 0.2s ease;
    }

    .nav-btn.active {
      color: var(--primary);
    }

    .nav-btn.active svg {
      transform: translateY(-2px) scale(1.05);
    }

    /* Sistema de Abas SPA */
    main {
      position: absolute;
      top: calc(var(--header-height) + env(safe-area-inset-top));
      bottom: calc(var(--nav-height) + env(safe-area-inset-bottom));
      left: 0; right: 0;
      overflow: hidden;
    }

    .tab-content {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.98);
      transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .tab-content.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .content-padding {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: -0.3px;
    }

    /* Grid de Vídeos Normais */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .thumb-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
    }

    .thumb-img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
    }

    .card-info {
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      user-select: text;
    }

    .card-footer {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--text-muted);
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:active {
      color: #ff4d4d;
      background: rgba(255, 77, 77, 0.1);
    }

    /* Feed Shorts Vertical / TikTok */
    #tab-shorts {
      padding: 0;
      scroll-snap-type: y mandatory;
      overflow-y: scroll;
      background: #000;
    }

    .short-container {
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .short-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .short-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 24px 16px;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
      pointer-events: none;
    }

    .short-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }

    .short-desc {
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      max-width: 80%;
      user-select: text;
    }

    /* Controles Laterais Flutuantes no Shorts */
    .shorts-actions {
      position: absolute;
      right: 12px;
      bottom: 80px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      z-index: 20;
      align-items: center;
    }

    .action-btn {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .action-btn:active {
      transform: scale(0.9);
      background: var(--primary);
    }

    .shorts-nav-controls {
      position: fixed;
      right: 12px;
      top: 40%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 30;
    }

    /* Player do Vídeo Normal */
    .player-view {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 2000;
      display: none;
      flex-direction: column;
    }

    .player-view.active {
      display: flex;
    }

    .player-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10, 12, 16, 0.8);
      backdrop-filter: blur(10px);
    }

    .player-video-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .player-video-box video {
      width: 100%;
      max-height: 100%;
    }

    /* Formulário de Upload */
    .upload-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
    }

    .format-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .format-card {
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .format-card.selected {
      border-color: var(--primary);
      background: rgba(255, 42, 95, 0.1);
    }

    .format-card svg {
      width: 24px; height: 24px;
      fill: var(--text-muted);
      margin-bottom: 4px;
    }

    .format-card.selected svg, .format-card.selected span {
      fill: var(--primary);
      color: #fff;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
      outline: none;
      user-select: text;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--primary);
    }

    textarea { resize: none; height: 70px; }

    .file-dropzone {
      border: 2px dashed var(--card-border);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.2);
      position: relative;
    }

    .file-dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%; height: 100%;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--primary-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-pip {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Animação Loading */
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 12, 16, 0.85);
      backdrop-filter: blur(10px);
      z-index: 5000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Overlay de Carregamento Globais -->
  <div class="loading-overlay" id="global-loading">
    <div class="spinner"></div>
    <span id="loading-text" style="font-size: 13px; font-weight: 500;">Processando vídeo...</span>
  </div>

  <header>
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/>
      </svg>
      CineStream APK
    </div>
  </header>

  <main>
    <!-- Aba 1: Feed Normal -->
    <div id="tab-feed" class="tab-content active">
      <div class="content-padding">
        <div class="section-title">Vídeos Longos</div>
        <div id="video-list" class="video-grid"></div>
      </div>
    </div>

    <!-- Aba 2: Shorts (TikTok Feed) -->
    <div id="tab-shorts" class="tab-content">
      <div id="shorts-wrapper"></div>
      
      <!-- Navegação Auxiliar Vertical -->
      <div class="shorts-nav-controls" id="shorts-controls">
        <button class="action-btn" onclick="scrollShort(-1)" title="Anterior">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
        </button>
        <button class="action-btn" onclick="scrollShort(1)" title="Próximo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
        </button>
      </div>
    </div>

    <!-- Aba 3: Upload -->
    <div id="tab-upload" class="tab-content">
      <div class="content-padding">
        <div class="upload-card">
          <div class="section-title">Postar Vídeo</div>
          
          <form id="upload-form">
            <label>Formato de Exibição</label>
            <div class="format-selector">
              <div class="format-card selected" onclick="selectFormat('normal', this)">
                <input type="radio" name="format" value="normal" checked hidden />
                <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14z"/></svg>
                <span style="font-size: 11px; font-weight: 600;">Vídeo Normal</span>
              </div>
              
              <div class="format-card" onclick="selectFormat('short', this)">
                <input type="radio" name="format" value="short" hidden />
                <svg viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
                <span style="font-size: 11px; font-weight: 600;">Shorts / TikTok</span>
              </div>
            </div>

            <div class="form-group">
              <label>Título do Conteúdo</label>
              <input type="text" id="input-title" placeholder="Ex: Meu projeto em 3D..." maxlength="100" required />
            </div>

            <div class="form-group">
              <label>Descrição</label>
              <textarea id="input-desc" placeholder="Detalhes ou tags do vídeo..." maxlength="300" required></textarea>
            </div>

            <div class="form-group">
              <label>Arquivo Mídia (Vídeo)</label>
              <div class="file-dropzone">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="var(--text-muted)"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                <div id="file-label" style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">Toque para selecionar o vídeo</div>
                <input type="file" id="input-video" accept="video/mp4,video/webm,video/ogg,video/quicktime" required />
              </div>
            </div>

            <button type="submit" class="btn-primary" style="margin-top: 8px;">
              Publicar no Feed
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- Player de Vídeo Modal / Tela Flutuante Suportada -->
  <div class="player-view" id="player-modal">
    <div class="player-header">
      <button class="icon-btn" onclick="closeModalPlayer()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      <span id="modal-player-title" style="font-size: 13px; font-weight: 600; text-align: center; flex: 1; margin: 0 10px;" class="card-title"></span>
      <button class="btn-pip" onclick="triggerPiP(document.getElementById('modal-video-player'))">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11h-8v6h8v-6zm4-7E2.01 2 2 2.9 2 4v12c0 1.1.9 2 2 2h4v2h6v-2h8c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H3V4h18v14z"/></svg>
        Flutuante
      </button>
    </div>
    <div class="player-video-box">
      <video id="modal-video-player" controls playsinline autoplay></video>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('tab-feed', this)">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Início
    </button>
    <button class="nav-btn" onclick="switchTab('tab-shorts', this)">
      <svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5L18 9.06c1.84-.96 2.53-3.23 1.56-5.06s-3.24-2.53-5.07-1.56L6 6.94c-1.29.68-2.07 2.04-2 3.49.07 1.42.93 2.67 2.22 3.25l1.2.5L6 14.93c-1.84.96-2.53 3.23-1.56 5.06s3.24 2.53 5.07 1.56l8.43-4.44c1.29-.68 2.07-2.04 2-3.49-.07-1.42-.93-2.67-2.17-3.3zM10 14.5v-5l4.5 2.5L10 14.5z"/></svg>
      Shorts
    </button>
    <button class="nav-btn" onclick="switchTab('tab-upload', this)">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      Postar
    </button>
  </nav>

  <script>
    /* --- ARQUITETURA DE DADOS E SEGURANÇA (IndexedDB) --- */
    let db;
    const DB_NAME = "CineStreamAPK_DB";
    const DB_VERSION = 1;
    const MAX_FILE_SIZE = 100 * 1024 * 1024; // Limitador de 100MB para otimização do celular/APK

    const dbReq = indexedDB.open(DB_NAME, DB_VERSION);

    dbReq.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("videos")) {
        const store = db.createObjectStore("videos", { keyPath: "id", autoIncrement: true });
        store.createIndex("format", "format", { unique: false });
      }
    };

    dbReq.onsuccess = (e) => {
      db = e.target.result;
      loadContent();
    };

    dbReq.onerror = () => alert("Erro ao inicializar o banco de dados local.");

    /* --- SANITIZAÇÃO DE SEGURANÇA (Prevenção XSS) --- */
    function sanitizeHTML(str) {
      const temp = document.createElement('div');
      temp.textContent = str;
      return temp.innerHTML;
    }

    /* --- NAVEGAÇÃO ENTRE ABAS --- */
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      const activeTab = document.getElementById(tabId);
      if (activeTab) activeTab.classList.add('active');

      if (btn) {
        btn.classList.add('active');
      } else {
        const navMap = { 'tab-feed': 0, 'tab-shorts': 1, 'tab-upload': 2 };
        document.querySelectorAll('.nav-btn')[navMap[tabId]]?.classList.add('active');
      }

      pauseAllVideos();
    }

    /* --- SISTEMA DE TELA FLUTUANTE (Picture-in-Picture) --- */
    async function triggerPiP(videoElement) {
      if (!videoElement) return;

      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (document.pictureInPictureEnabled) {
          await videoElement.requestPictureInPicture();
        } else {
          alert("A tela flutuante não é suportada neste dispositivo.");
        }
      } catch (err) {
        console.warn("Erro ao acionar janela flutuante:", err);
      }
    }

    // Mantém o vídeo tocando e entra em PiP automaticamente se o app for para segundo plano (quando suportado)
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        const activeModalVideo = document.getElementById('modal-video-player');
        if (activeModalVideo && !activeModalVideo.paused && document.pictureInPictureEnabled) {
          activeModalVideo.requestPictureInPicture().catch(() => {});
        }
      }
    });

    /* --- SELEÇÃO DE FORMATO & UPLOAD --- */
    let currentSelectedFormat = 'normal';

    function selectFormat(format, element) {
      currentSelectedFormat = format;
      document.querySelectorAll('.format-card').forEach(c => c.classList.remove('selected'));
      element.classList.add('selected');
      element.querySelector('input').checked = true;
    }

    const fileInput = document.getElementById('input-video');
    const fileLabel = document.getElementById('file-label');

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        if (file.size > MAX_FILE_SIZE) {
          alert("O vídeo deve ter no máximo 100MB para melhor performance no celular.");
          fileInput.value = "";
          fileLabel.innerText = "Toque para selecionar o vídeo";
          fileLabel.style.color = "var(--text-muted)";
          return;
        }
        fileLabel.innerText = `${file.name} (${(file.size / (1024 * 1024)).toFixed(1)}MB)`;
        fileLabel.style.color = "var(--primary)";
      }
    });

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('input-title').value.trim();
      const desc = document.getElementById('input-desc').value.trim();
      const file = fileInput.files[0];

      if (!file || !title) return;

      showLoading(true, "Gerando miniatura e salvando...");

      try {
        const thumbBlob = await generateThumbnail(file);

        const record = {
          title: sanitizeHTML(title),
          desc: sanitizeHTML(desc),
          format: currentSelectedFormat,
          videoBlob: file,
          thumbBlob: thumbBlob,
          timestamp: Date.now()
        };

        const tx = db.transaction("videos", "readwrite");
        tx.objectStore("videos").add(record);

        tx.oncomplete = () => {
          showLoading(false);
          document.getElementById('upload-form').reset();
          fileLabel.innerText = "Toque para selecionar o vídeo";
          fileLabel.style.color = "var(--text-muted)";
          selectFormat('normal', document.querySelectorAll('.format-card')[0]);

          loadContent();
          switchTab(record.format === 'short' ? 'tab-shorts' : 'tab-feed');
        };
      } catch (err) {
        showLoading(false);
        alert("Falha no processamento do vídeo.");
      }
    });

    function generateThumbnail(file) {
      return new Promise((resolve, reject) => {
        const video = document.createElement('video');
        const url = URL.createObjectURL(file);
        video.src = url;
        video.muted = true;
        video.currentTime = 0.5;

        video.onloadeddata = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 360;
          canvas.height = 200;
          const ctx = canvas.getContext('2d');

          video.play().then(() => {
            video.pause();
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob((blob) => {
              URL.revokeObjectURL(url);
              resolve(blob);
            }, 'image/jpeg', 0.7);
          }).catch(reject);
        };
        video.onerror = reject;
      });
    }

    /* --- CARREGAMENTO E RENDERIZAÇÃO --- */
    let currentObjectUrls = [];

    function clearMemoryUrls() {
      currentObjectUrls.forEach(url => URL.revokeObjectURL(url));
      currentObjectUrls = [];
    }

    function loadContent() {
      clearMemoryUrls();

      const feedList = document.getElementById('video-list');
      const shortsWrapper = document.getElementById('shorts-wrapper');

      feedList.innerHTML = '';
      shortsWrapper.innerHTML = '';

      const tx = db.transaction("videos", "readonly");
      const store = tx.objectStore("videos");
      const req = store.getAll();

      req.onsuccess = () => {
        const items = req.result;
        const normalList = items.filter(i => i.format === 'normal');
        const shortsList = items.filter(i => i.format === 'short');

        // Renderiza Lista de Vídeos Longos
        if (normalList.length === 0) {
          feedList.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">Nenhum vídeo publicado ainda.</div>`;
        } else {
          normalList.forEach(item => {
            const thumbUrl = URL.createObjectURL(item.thumbBlob);
            currentObjectUrls.push(thumbUrl);

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <div class="thumb-wrapper">
                <img src="${thumbUrl}" class="thumb-img" loading="lazy" />
              </div>
              <div class="card-info">
                <div class="card-title">${item.title}</div>
                <div class="card-footer">
                  <span>${new Date(item.timestamp).toLocaleDateString()}</span>
                  <button class="icon-btn" onclick="deleteVideo(event, ${item.id})">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                  </button>
                </div>
              </div>
            `;
            card.onclick = (e) => {
              if (!e.target.closest('.icon-btn')) openModalPlayer(item);
            };
            feedList.appendChild(card);
          });
        }

        // Renderiza Feed de Shorts TikTok
        if (shortsList.length === 0) {
          shortsWrapper.innerHTML = `<div class="empty-state" style="padding-top: 100px;">Nenhum Short disponível.</div>`;
          document.getElementById('shorts-controls').style.display = 'none';
        } else {
          document.getElementById('shorts-controls').style.display = 'flex';
          shortsList.forEach(item => {
            const videoUrl = URL.createObjectURL(item.videoBlob);
            currentObjectUrls.push(videoUrl);

            const container = document.createElement('div');
            container.className = 'short-container';
            container.innerHTML = `
              <video class="short-video" src="${videoUrl}" loop playsinline onclick="toggleShortPlay(this)"></video>
              <div class="short-overlay">
                <div class="short-title">${item.title}</div>
                <div class="short-desc">${item.desc}</div>
              </div>
              <div class="shorts-actions">
                <button class="action-btn" onclick="triggerPiP(this.parentElement.parentElement.querySelector('video'))">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11h-8v6h8v-6zm4-7E2.01 2 2 2.9 2 4v12c0 1.1.9 2 2 2h4v2h6v-2h8c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H3V4h18v14z"/></svg>
                </button>
                <button class="action-btn" onclick="deleteVideo(event, ${item.id})">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </button>
              </div>
            `;
            shortsWrapper.appendChild(container);
          });

          initShortsIntersection();
        }
      };
    }

    /* --- MODAL E REPRODUÇÃO --- */
    function openModalPlayer(item) {
      const modal = document.getElementById('player-modal');
      const video = document.getElementById('modal-video-player');
      const title = document.getElementById('modal-player-title');

      const videoUrl = URL.createObjectURL(item.videoBlob);
      video.src = videoUrl;
      title.innerText = item.title;

      modal.classList.add('active');
      video.play().catch(() => {});
    }

    function closeModalPlayer() {
      const modal = document.getElementById('player-modal');
      const video = document.getElementById('modal-video-player');
      
      video.pause();
      video.src = "";
      modal.classList.remove('active');
    }

    function scrollShort(direction) {
      const container = document.getElementById('tab-shorts');
      container.scrollBy({ top: direction * container.clientHeight, behavior: 'smooth' });
    }

    function initShortsIntersection() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target.querySelector('video');
          if (video) {
            if (entry.isIntersecting) {
              video.play().catch(() => {});
            } else {
              video.pause();
              video.currentTime = 0;
            }
          }
        });
      }, { threshold: 0.6 });

      document.querySelectorAll('.short-container').forEach(el => observer.observe(el));
    }

    function toggleShortPlay(video) {
      if (video.paused) video.play();
      else video.pause();
    }

    function pauseAllVideos() {
      document.querySelectorAll('video').forEach(v => v.pause());
    }

    function deleteVideo(e, id) {
      e.stopPropagation();
      if (confirm("Remover este vídeo permanentemente?")) {
        const tx = db.transaction("videos", "readwrite");
        tx.objectStore("videos").delete(id);
        tx.oncomplete = () => loadContent();
      }
    }

    function showLoading(show, text = "") {
      const overlay = document.getElementById('global-loading');
      document.getElementById('loading-text').innerText = text;
      overlay.style.display = show ? 'flex' : 'none';
    }
  </script>
</body>
</html>
